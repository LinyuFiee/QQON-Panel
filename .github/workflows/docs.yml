name: 文档站点

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap.ps1'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      # Reuse the existing release workflow's verified official checkout pin.
      - name: 检出文档与入口源文件
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      # Official tag refs verified before pinning; upgrades require review.
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装锁定的文档依赖
        run: npm ci
      - name: 构建并检查站内链接及入口副本
        run: npm run build
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do not auto-enable Pages or request contents:write; main owns setup.
      - name: 核对 Pages 配置
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false
      - name: 部署文档
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
